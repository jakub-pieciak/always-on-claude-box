# Lightweight always-on profile for the Chromebox (btop 1.4)
color_theme = "Default"
theme_background = True
truecolor = True
vim_keys = False
rounded_corners = True
# cpu+temps, memory/disks, network, processes
shown_boxes = "cpu mem net proc"
# refresh every 3 s instead of 2 s to save CPU
update_ms = 3000
proc_sorting = "cpu lazy"
proc_tree = False
proc_per_core = False
proc_mem_bytes = True
check_temp = True
cpu_sensor = "Auto"
show_coretemp = True
temp_scale = "celsius"
show_cpu_freq = True
show_uptime = True
show_battery = False
show_disks = True
only_physical = True
use_fstab = True
net_auto = True
net_iface = ""
log_level = "WARNING"
